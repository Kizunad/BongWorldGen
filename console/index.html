<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BongWorldGen · wilderness 控制台 (dev)</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(18, 20, 26, 0.92);
        --panel-border: #2c3140;
        --accent: #6fb0ff;
        --text: #d6dae2;
        --text-dim: #8a909c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #07090d;
        color: var(--text);
      }
      #app { position: relative; width: 100vw; height: 100vh; }
      #viewport { position: absolute; inset: 0; }
      #viewport canvas { display: block; }

      #sidebar {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 264px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        backdrop-filter: blur(4px);
      }
      #sidebar h1 {
        font-size: 14px;
        margin: 0 0 8px;
        letter-spacing: 0.5px;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 14px 0 6px;
      }
      .layer-toggle { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
      .layer-toggle input { accent-color: var(--accent); }
      #zone-list { list-style: none; margin: 0; padding: 0; }
      #zone-list li {
        padding: 5px 8px;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #zone-list li:hover { background: rgba(111, 176, 255, 0.12); }
      #zone-list li.selected { background: rgba(111, 176, 255, 0.22); }
      .zone-swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; }
      .wilderness-row { display: flex; align-items: center; gap: 7px; padding: 4px 5px; color: var(--text-dim); font-size: 12px; cursor: pointer; border-radius: 3px; }
      .wilderness-row:hover { background: rgba(111, 176, 255, 0.12); color: var(--text); }
      .wilderness-row.selected { background: rgba(255, 209, 102, 0.16); color: var(--text); box-shadow: inset 3px 0 #ffd166; }
      .wilderness-row:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
      .wilderness-swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; border: 1px solid rgba(255,255,255,.3); }
      #param-panel textarea {
        width: 100%;
        height: 150px;
        background: #0d1016;
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        resize: vertical;
      }
      button.action {
        width: 100%;
        margin-top: 8px;
        padding: 7px;
        background: var(--accent);
        color: #07090d;
        border: none;
        border-radius: 5px;
        font-weight: 600;
        cursor: pointer;
      }
      button.action:disabled { opacity: 0.5; cursor: progress; }
      #status {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-size: 12px;
        color: var(--text-dim);
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 6px 10px;
        max-width: 60vw;
      }
      #help {
        position: absolute;
        bottom: 12px;
        right: 12px;
        font-size: 11px;
        color: var(--text-dim);
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 6px 10px;
        text-align: right;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <aside id="sidebar">
        <h1>BongWorldGen 控制台 <span style="color: var(--text-dim)">dev</span></h1>
        <h2>图层</h2>
        <div id="layer-toggles"></div>
        <h2>荒野高亮 / wilderness_id</h2>
        <div id="wilderness-legend"></div>
        <h2>Zones</h2>
        <ul id="zone-list"></ul>
        <h2>Zone 参数（当前静态数据，只读）</h2>
        <div id="param-panel">
          <textarea id="param-edit" spellcheck="false" placeholder="选择一个 zone…"></textarea>
          <p style="font-size: 11px; color: var(--text-dim); margin: 4px 0 0">
            这些字段来自 Python zone 数据。修改后请重新运行生成器；当前控制台只负责查看
            已生成的 raster，不直接改写世界文件。
          </p>
          <button id="regen-btn" type="button" class="action" disabled>重生成 zone（需生成服务）</button>
        </div>
      </aside>
      <div id="status">初始化…</div>
      <div id="help">
        WASD 平移 · QE 升降 · 拖拽旋转 · 滚轮缩放
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
